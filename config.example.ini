[app]
name = Amazon Preference Recommender

[aws]
region = us-east-1
dynamodb_table = amazon-product-recommendations
use_dynamodb = false
bedrock_model_id = us.anthropic.claude-haiku-4-5-20251001-v1:0

[scraper]
amazon_domain = https://www.amazon.com
max_pages = 1
max_results = 12
timeout_ms = 25000

