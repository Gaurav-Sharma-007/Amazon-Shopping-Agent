[app]
name = Amazon Preference Recommender

[aws]
region = ap-south-1
dynamodb_table = Product-Recommedation
use_dynamodb = true

# Model used for final recommendation explanation (response builder)
bedrock_model_id = global.anthropic.claude-haiku-4-5-20251001-v1:0

# Model used for LLM Query Planner, Relevance Filter, and Ranker.
# Set to a more capable model (e.g. Claude Sonnet) for better intent understanding.
query_planner_model_id = global.anthropic.claude-haiku-4-5-20251001-v1:0

[scraper]
amazon_domain = https://www.amazon.in
max_pages = 1
max_results = 12
timeout_ms = 25000

# In-process / DynamoDB query result cache TTL in seconds (0 = disabled)
query_cache_ttl_seconds = 300
